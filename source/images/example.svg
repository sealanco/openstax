<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" width="100%" height="100%">
  <defs>
    <!-- Arrowhead for the main number line (Black) -->
    <marker id="arrow-black-left" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#1a1a1a" />
    </marker>
    <marker id="arrow-black-right" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a" />
    </marker>

    <!-- Arrowhead for "smaller" (Light Blue Left) -->
    <marker id="arrow-blue-left" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#4ebecb" />
    </marker>

    <!-- Arrowhead for "larger" (Light Blue Right) -->
    <marker id="arrow-blue-right" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ebecb" />
    </marker>
  </defs>

  <style>
    .label {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      fill: #1a1a1a;
      text-anchor: middle;
    }
    .text-annotation {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      fill: #1a1a1a;
      text-anchor: middle;
    }
  </style>

  <!-- Main Number Line -->
  <line x1="15" y1="90" x2="585" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arrow-black-left)" marker-end="url(#arrow-black-right)" />

  <!-- Ticks and Numbers (0 to 6) -->
  <!-- 0 -->
  <line x1="30" y1="83" x2="30" y2="97" stroke="#1a1a1a" stroke-width="1.2" />
  <text x="30" y="115" class="label">0</text>

  <!-- 1 -->
  <line x1="117" y1="83" x2="117" y2="97" stroke="#1a1a1a" stroke-width="1.2" />
  <text x="117" y="115" class="label">1</text>

  <!-- 2 -->
  <line x1="204" y1="83" x2="204" y2="97" stroke="#1a1a1a" stroke-width="1.2" />
  <text x="204" y="115" class="label">2</text>

  <!-- 3 -->
  <line x1="291" y1="83" x2="291" y2="97" stroke="#1a1a1a" stroke-width="1.2" />
  <text x="291" y="115" class="label">3</text>

  <!-- 4 -->
  <line x1="378" y1="83" x2="378" y2="97" stroke="#1a1a1a" stroke-width="1.2" />
  <text x="378" y="115" class="label">4</text>

  <!-- 5 -->
  <line x1="465" y1="83" x2="465" y2="97" stroke="#1a1a1a" stroke-width="1.2" />
  <text x="465" y="115" class="label">5</text>

  <!-- 6 -->
  <line x1="552" y1="83" x2="552" y2="97" stroke="#1a1a1a" stroke-width="1.2" />
  <text x="552" y="115" class="label">6</text>

  <!-- "smaller" arrow and text -->
  <text x="160" y="47" class="text-annotation">smaller</text>
  <line x1="40" y1="58" x2="360" y2="58" stroke="#4ebecb" stroke-width="1.8" marker-start="url(#arrow-blue-left)" />

  <!-- "larger" arrow and text -->
  <text x="430" y="15" class="text-annotation">larger</text>
  <line x1="228" y1="25" x2="565" y2="25" stroke="#4ebecb" stroke-width="1.8" marker-end="url(#arrow-blue-right)" />
</svg>
